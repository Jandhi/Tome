    - { block: "minecraft:spruce_log[axis=x]", offset: [1, 0, 0], layer: ground, swap: wood }
    - { block: "minecraft:spruce_log[axis=x]", offset: [2, 0, 0], layer: ground, swap: wood }
    - { block: "minecraft:stripped_spruce_log[axis=x]", offset: [0, 1, 0], layer: ground }
    - { block: "minecraft:stripped_spruce_log[axis=x]", offset: [1, 1, 0], layer: ground }
  constraints:
