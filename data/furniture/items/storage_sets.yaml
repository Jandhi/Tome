    - { offset: [1, 0], constraint: wall }
    - { offset: [2, 0], constraint: wall }
    - { offset: [0, 1], constraint: empty_reachable }
    - { offset: [1, 1], constraint: empty_reachable }
    - { offset: [2, 1], constraint: empty_reachable }
